<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>2026社區消費連環賞 - 優惠券管理器</title>
    <meta name="description" content="澳門2026社區消費連環賞，簡潔實用的電子優惠券記錄工具。">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: system-ui, 'Segoe UI', 'Roboto', 'Noto Sans', 'PingFang TC', 'Microsoft YaHei', sans-serif;
        }
        body {
            background: #f5f7fb;
            margin: 0;
            padding: 0 0 100px 0;
            color: #1a2f4a;
            min-height: 100vh;
        }
        .app {
            max-width: 520px;
            margin: 0 auto;
            padding: 16px;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 4px 16px;
        }
        .app-header h1 {
            margin: 0;
            font-size: 1.15rem;
            color: #1a2f4a;
            font-weight: 700;
        }
        .icon-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 50%;
            color: #1e5f9e;
            transition: 0.2s;
        }
        .icon-btn:active {
            background: #e8eef7;
        }

        .activity-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 14px 16px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(30, 95, 158, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .activity-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .activity-icon {
            width: 38px;
            height: 38px;
            background: #e6f4ea;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }
        .activity-info .label {
            font-size: 0.72rem;
            color: #7b8a9e;
            margin-bottom: 2px;
        }
        .activity-info .value {
            font-size: 0.9rem;
            font-weight: 600;
            color: #1a2f4a;
        }
        .activity-status {
            background: #e6f4ea;
            color: #1e7a3f;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.72rem;
            font-weight: 700;
            white-space: nowrap;
        }
        .activity-status.ended {
            background: #f5e6e6;
            color: #a23b3b;
        }
        .activity-status.pending {
            background: #fdf3e3;
            color: #a16b1a;
        }

        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 14px 16px;
            box-shadow: 0 2px 8px rgba(30, 95, 158, 0.06);
        }
        .stat-card.blue {
            background: linear-gradient(135deg, #e8f1fb, #dbe9f9);
        }
        .stat-card.purple {
            background: linear-gradient(135deg, #eee8fb, #e4daf8);
        }
        .stat-card .stat-head {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            color: #5a7690;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .stat-card .stat-head .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .stat-card.blue .dot { background: #3b7cbf; }
        .stat-card.purple .dot { background: #8b5cf6; }
        .stat-card .stat-num {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1a2f4a;
            letter-spacing: -0.5px;
        }
        .stat-card .stat-num small {
            font-size: 0.7rem;
            font-weight: 600;
            color: #5a7690;
            margin-left: 3px;
        }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 0 4px;
            gap: 8px;
        }
        .section-title h2 {
            margin: 0;
            font-size: 0.95rem;
            font-weight: 700;
            color: #1a2f4a;
            white-space: nowrap;
        }
        .section-title .right-part {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: flex-end;
            min-width: 0;
        }
        .section-title .count {
            font-size: 0.8rem;
            color: #7b8a9e;
            font-weight: 500;
            white-space: nowrap;
        }
        .week-view-select {
            padding: 6px 10px;
            border: 1.5px solid #d6e3f2;
            border-radius: 12px;
            font-size: 0.78rem;
            background: #ffffff;
            color: #1a2f4a;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            font-family: inherit;
            width: auto;
            min-width: 160px;
            max-width: 100%;
        }
        .week-view-select:focus {
            border-color: #1e5f9e;
        }

        .wallet-group {
            background: #ffffff;
            border-radius: 20px;
            padding: 14px 16px 16px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(30, 95, 158, 0.06);
        }
        .wallet-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0f4f9;
        }
        .wallet-avatar {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: white;
            font-size: 0.75rem;
            flex-shrink: 0;
        }
        .wallet-name {
            font-weight: 700;
            font-size: 0.9rem;
            color: #1a2f4a;
            flex: 1;
        }
        .wallet-meta {
            font-size: 0.72rem;
            color: #7b8a9e;
        }

        .voucher-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        @media (max-width: 380px) {
            .voucher-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .voucher-card {
            background: #f8fbff;
            border: 1.5px solid #d6e3f2;
            border-radius: 16px;
            padding: 12px 6px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
        }
        .voucher-card:active {
            transform: scale(0.96);
        }
        .voucher-card.used {
            background: #f3f5f8;
            border-color: #e2e6ec;
            opacity: 0.65;
        }
        .voucher-card.expired {
            background: #fdf0ed;
            border-color: #f5c9c0;
            opacity: 0.85;
        }
        .voucher-card.merchant {
            background: #fff8ee;
            border-color: #ffddb0;
        }
        .voucher-card.gift {
            background: #f1f8ec;
            border-color: #cbe5b8;
        }
        .voucher-card .v-amount {
            font-size: 1.35rem;
            font-weight: 800;
            color: #1e5f9e;
            line-height: 1.1;
            letter-spacing: -0.5px;
        }
        .voucher-card.used .v-amount {
            color: #98a4b3;
        }
        .voucher-card.expired .v-amount {
            color: #c94a2c;
        }
        .voucher-card.merchant .v-amount {
            color: #b35c00;
            font-size: 1.05rem;
        }
        .voucher-card.gift .v-amount {
            color: #2d5a1b;
            font-size: 1.05rem;
        }
        .voucher-card .v-status {
            font-size: 0.7rem;
            font-weight: 700;
            margin-top: 6px;
            color: #3b7cbf;
        }
        .voucher-card.used .v-status {
            color: #98a4b3;
        }
        .voucher-card.expired .v-status {
            color: #c94a2c;
        }
        .voucher-card .v-id {
            position: absolute;
            top: 4px;
            right: 6px;
            font-size: 0.6rem;
            color: #b0bcc9;
            font-weight: 600;
        }

        /* 剩餘天數提示 */
        .days-remaining {
            margin-top: 12px;
            text-align: center;
            font-size: 0.78rem;
            font-weight: 600;
            color: #8b5a1a;
            background: #fff8ee;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #ffe0b0;
        }
        .days-remaining.urgent {
            color: #c94a2c;
            background: #fdf0ed;
            border-color: #f5c9c0;
        }

        .empty-state {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            color: #7b8a9e;
            box-shadow: 0 2px 8px rgba(30, 95, 158, 0.06);
        }
        .empty-state .emoji {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 10px;
            opacity: 0.6;
        }
        .empty-state p {
            margin: 0;
            font-size: 0.85rem;
        }

        .fab {
            position: fixed;
            right: 20px;
            bottom: 24px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffb347, #ff8c42);
            color: white;
            border: none;
            font-size: 1.7rem;
            font-weight: 300;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(255, 140, 66, 0.45);
            transition: all 0.2s;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .fab:active {
            transform: scale(0.94);
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(20, 40, 70, 0.45);
            z-index: 100;
            align-items: flex-end;
            justify-content: center;
            backdrop-filter: blur(2px);
        }
        .overlay.open {
            display: flex;
        }
        .sheet {
            background: #ffffff;
            width: 100%;
            max-width: 520px;
            border-radius: 24px 24px 0 0;
            padding: 20px 20px 28px;
            max-height: 88vh;
            overflow-y: auto;
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .sheet-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            position: sticky;
            top: -20px;
            background: #ffffff;
            padding: 6px 0 10px;
            z-index: 2;
        }
        .sheet-header h3 {
            margin: 0;
            font-size: 1.05rem;
            color: #1a2f4a;
        }
        .close-btn {
            background: #f0f4f9;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            color: #5a7690;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .field {
            margin-bottom: 14px;
        }
        .field label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: #5a7690;
            margin-bottom: 6px;
            padding-left: 4px;
        }
        .field select,
        .field input,
        .field textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #d6e3f2;
            border-radius: 14px;
            font-size: 0.92rem;
            background: #ffffff;
            outline: none;
            transition: 0.15s;
            font-family: inherit;
            color: #1a2f4a;
        }
        .field select:focus,
        .field input:focus,
        .field textarea:focus {
            border-color: #1e5f9e;
            box-shadow: 0 0 0 3px rgba(30, 95, 158, 0.1);
        }
        .field textarea {
            resize: vertical;
            min-height: 80px;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #ffb347, #ff8c42);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 140, 66, 0.35);
            margin-top: 6px;
            transition: 0.2s;
        }
        .submit-btn:active {
            transform: scale(0.98);
        }
        .submit-btn.secondary {
            background: #f0f4f9;
            color: #1e5f9e;
            box-shadow: none;
        }
        .submit-btn.danger {
            background: #e76f51;
            box-shadow: 0 4px 12px rgba(231, 111, 81, 0.35);
        }

        .detail-amount {
            text-align: center;
            padding: 16px 0 8px;
        }
        .detail-amount .big {
            font-size: 2.4rem;
            font-weight: 800;
            color: #1e5f9e;
            letter-spacing: -1px;
        }
        .detail-amount .big.merchant { color: #b35c00; font-size: 1.6rem; }
        .detail-amount .big.gift { color: #2d5a1b; font-size: 1.6rem; }
        .detail-amount .big small {
            font-size: 0.9rem;
            color: #5a7690;
            font-weight: 600;
            margin-left: 4px;
        }
        .detail-type {
            text-align: center;
            font-size: 0.8rem;
            color: #7b8a9e;
            margin-bottom: 16px;
        }
        .detail-rows {
            background: #f8fbff;
            border-radius: 16px;
            padding: 4px 14px;
            margin-bottom: 16px;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 0;
            border-bottom: 1px solid #e8eef7;
            font-size: 0.88rem;
        }
        .detail-row:last-child {
            border-bottom: none;
        }
        .detail-row .k {
            color: #5a7690;
            font-weight: 500;
        }
        .detail-row .v {
            color: #1a2f4a;
            font-weight: 600;
            text-align: right;
            max-width: 60%;
            word-break: break-word;
        }
        .detail-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }
        .detail-actions .submit-btn {
            margin-top: 0;
        }
        .detail-note-btn {
            grid-column: 1 / -1;
        }

        .settings-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .settings-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: #f8fbff;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            color: #1a2f4a;
            text-align: left;
            width: 100%;
            font-weight: 500;
            transition: 0.15s;
        }
        .settings-item:active {
            background: #eef4fb;
        }
        .settings-item .icon {
            font-size: 1.15rem;
        }
        .settings-item.danger {
            color: #c94a2c;
            background: #fdf0ed;
        }

        /* 語言切換器 */
        .lang-switcher {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .lang-btn {
            flex: 1;
            padding: 10px 6px;
            border: 1.5px solid #d6e3f2;
            background: #ffffff;
            color: #1a2f4a;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
        }
        .lang-btn.active {
            background: #1e5f9e;
            color: white;
            border-color: #1e5f9e;
        }

        .settings-note {
            margin-top: 16px;
            padding: 12px 14px;
            background: #f0f6fc;
            border-radius: 14px;
            font-size: 0.75rem;
            color: #5a7690;
            line-height: 1.5;
            display: flex;
            gap: 8px;
        }
        .settings-note .icon { font-size: 0.95rem; }

        #importFileInput { display: none; }

        @media (min-width: 900px) {
            .app {
                max-width: 900px;
            }
            .voucher-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            .fab {
                right: calc(50% - 450px + 20px);
            }
        }
        @media (min-width: 1200px) {
            .app {
                max-width: 1100px;
            }
            .voucher-grid {
                grid-template-columns: repeat(5, 1fr);
            }
            .fab {
                right: calc(50% - 550px + 24px);
            }
        }

        .wallet-avatar[data-wallet="MPay"] { background: #e83f3f; }
        .wallet-avatar[data-wallet="支付寶（澳門）"],
        .wallet-avatar[data-wallet="支付宝（澳门）"] { background: #1677ff; }
        .wallet-avatar[data-wallet="澳門中銀手機銀行"],
        .wallet-avatar[data-wallet="澳门中银手机银行"] { background: #c8102e; }
        .wallet-avatar[data-wallet="工銀e支付"],
        .wallet-avatar[data-wallet="工银e支付"] { background: #b41f24; }
        .wallet-avatar[data-wallet="豐付寶"],
        .wallet-avatar[data-wallet="丰付宝"] { background: #00693e; }
        .wallet-avatar[data-wallet="廣發移動支付錢包"],
        .wallet-avatar[data-wallet="广发移动支付钱包"] { background: #c8102e; }
        .wallet-avatar[data-wallet="LusoPay"] { background: #e30613; }
        .wallet-avatar[data-wallet="極易付（UePay）"],
        .wallet-avatar[data-wallet="极易付（UePay）"] { background: #1e5f9e; }
    </style>
</head>
<body>
<div class="app">

    <div class="app-header">
        <h1 data-i18n="appTitle">優惠券管理器</h1>
        <button class="icon-btn" id="settingsBtn" title="設定">⚙️</button>
    </div>

    <div class="activity-card">
        <div class="activity-left">
            <div class="activity-icon">📅</div>
            <div class="activity-info">
                <div class="label" data-i18n="activityDate">活動日期</div>
                <div class="value">2026/10/09 - 2026/12/17</div>
            </div>
        </div>
        <div class="activity-status" id="activityStatus">載入中</div>
    </div>

    <div class="stats-row">
        <div class="stat-card blue">
            <div class="stat-head"><span class="dot"></span><span data-i18n="statRemaining">未使用金額</span></div>
            <div class="stat-num"><span id="statRemaining">0</span><small>MOP</small></div>
        </div>
        <div class="stat-card purple">
            <div class="stat-head"><span class="dot"></span><span data-i18n="statAvailable">可用優惠額度</span></div>
            <div class="stat-num"><span id="statAvailable">0</span><small>MOP</small></div>
        </div>
    </div>

    <div class="section-title">
        <h2 data-i18n="myCoupons">我的優惠券</h2>
        <div class="right-part">
            <select id="weekViewSelect" class="week-view-select"></select>
            <span class="count" id="totalCount">0 張</span>
        </div>
    </div>
    <div id="voucherList"></div>

</div>

<button class="fab" id="fabAddBtn" title="新增優惠券">+</button>

<!-- 新增彈窗 -->
<div class="overlay" id="addOverlay">
    <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-header">
            <h3 data-i18n="addTitle">➕ 新增優惠券</h3>
            <button class="close-btn" data-close="addOverlay">✕</button>
        </div>

        <div class="field">
            <label data-i18n="labelWeek">📆 領券週</label>
            <select id="weekSelectAdd"></select>
        </div>

        <div class="field">
            <label data-i18n="labelType">🏷️ 券種</label>
            <select id="couponTypeSelect">
                <option value="gov" data-i18n="typeGov">政府電子優惠券</option>
                <option value="merchant_discount" data-i18n="typeMerchant">商戶滿減券（滿100減12）</option>
                <option value="gift" data-i18n="typeGift">消費禮遇券（禮品）</option>
            </select>
        </div>

        <div class="field">
            <label data-i18n="labelAmount">💰 面額 / 內容</label>
            <select id="voucherAmountSelect"></select>
        </div>

        <div class="field">
            <label data-i18n="labelWallet">👛 電子錢包</label>
            <select id="walletSelect"></select>
        </div>

        <button class="submit-btn" id="addVoucherBtn" data-i18n="btnConfirmAdd">確認新增</button>
    </div>
</div>

<!-- 詳情彈窗 -->
<div class="overlay" id="detailOverlay">
    <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-header">
            <h3 data-i18n="detailTitle">優惠券詳情</h3>
            <button class="close-btn" data-close="detailOverlay">✕</button>
        </div>

        <div class="detail-amount">
            <div class="big" id="detailAmount">--</div>
        </div>
        <div class="detail-type" id="detailType">--</div>

        <div class="detail-rows">
            <div class="detail-row">
                <span class="k" data-i18n="rowWeek">📆 歸屬週次</span>
                <span class="v" id="detailWeek">--</span>
            </div>
            <div class="detail-row">
                <span class="k" data-i18n="rowWallet">👛 電子錢包</span>
                <span class="v" id="detailWallet">--</span>
            </div>
            <div class="detail-row">
                <span class="k" data-i18n="rowMinSpend">🎯 最低消費額</span>

    /* ===== 各語言對應的錢包顯示名稱 ===== */
    const WALLET_NAMES = {
        'zh-HK': ["MPay", "支付寶（澳門）", "澳門中銀手機銀行", "工銀e支付", "豐付寶", "廣發移動支付錢包", "LusoPay", "極易付（UePay）"],
        'zh-CN': ["MPay", "支付宝（澳门）", "澳门中银手机银行", "工银e支付", "丰付宝", "广发移动支付钱包", "LusoPay", "极易付（UePay）"],
        'en':    ["MPay", "Alipay (Macau)", "BOC Macau", "ICBC e-Pay", "Fung Fu Bao", "CGB Mobile Wallet", "LusoPay", "UePay"]
    };

    /* ===== 各語言對應的券種顯示名稱 ===== */
    const COUPON_TYPE_LABELS = {
        'zh-HK': { gov: '政府電子優惠券', merchant_discount: '商戶滿減券', gift: '消費禮遇券' },
        'zh-CN': { gov: '政府电子优惠券', merchant_discount: '商户满减券', gift: '消费礼遇券' },
        'en':    { gov: 'Government E-Coupon', merchant_discount: 'Merchant Discount', gift: 'Consumption Gift' }
    };

    /* ===== 活動設定 ===== */
    const ACTIVITY_START = new Date(2026, 9, 9);
    const ACTIVITY_END   = new Date(2026, 11, 17);
    const STORAGE_KEY = 'macau_voucher_2026_round2';
    const LANG_KEY = 'macau_voucher_2026_lang';

    let currentLang = 'zh-HK';

    function t(key, params) {
        let str = (I18N[currentLang] && I18N[currentLang][key]) || I18N['zh-HK'][key] || key;
        if (params) {
            Object.keys(params).forEach(k => {
                str = str.replace('{' + k + '}', params[k]);
            });
        }
        return str;
    }

    function getWalletNames() {
        return WALLET_NAMES[currentLang] || WALLET_NAMES['zh-HK'];
    }

    /* ===== 券種設定（內部鍵值固定，不受語言影響） ===== */
    const COUPON_TYPES = {
        gov: { defaultAmount: 50, minSpendMultiplier: 3 },
        merchant_discount: { defaultAmount: 12, minSpendMultiplier: 0, fixedMinSpend: 100 },
        gift: { defaultAmount: 0, minSpendMultiplier: 0 }
    };

    /* ===== 全域狀態 ===== */
    let vouchers = [];
    let weeksData = [];
    let nextDisplayId = 1;
    let currentDetailId = null;
    let currentViewWeekKey = '';

    /* ===== 週次 ===== */
    function generateWeeksList() {
        let weeks = [];
        let startFriday = new Date(ACTIVITY_START);
        while (startFriday.getDay() !== 5) {
            startFriday.setDate(startFriday.getDate() + 1);
        }
        let weekIndex = 1;
        while (startFriday <= ACTIVITY_END) {
            let friday = new Date(startFriday);
            let sunday = new Date(friday);
            sunday.setDate(friday.getDate() + 2);
            if (sunday > ACTIVITY_END) break;
            let redeemDeadline = new Date(sunday);
            redeemDeadline.setDate(sunday.getDate() + 4);
            weeks.push({
                key: `${formatDateKey(friday)}_to_${formatDateKey(sunday)}`,
                index: weekIndex,
                friday: new Date(friday),
                sunday: new Date(sunday),
                redeemDeadline: redeemDeadline
            });
            startFriday.setDate(startFriday.getDate() + 7);
            weekIndex++;
        }
        return weeks;
    }
    function formatDate(d) {
        return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
    }
    function formatDateKey(d) {
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function formatShortDate(d) {
        return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
    }
    function getWeekShortLabel(wk) {
        return `${t('weekLabelPrefix')}${wk.index}${t('weekLabelSuffix')} (${formatShortDate(wk.friday)} ~ ${formatShortDate(wk.sunday)})`;
    }
    function getWeekFullLabel(wk) {
        if (!wk) return '';
        return `${t('weekLabelPrefix')}${wk.index}${t('weekLabelSuffix')} (${formatShortDate(wk.friday)} ~ ${formatShortDate(wk.sunday)})`;
    }
    function getWeekLabelByKey(key) {
        const wk = weeksData.find(w => w.key === key);
        return wk ? getWeekFullLabel(wk) : key;
    }
    function getDefaultWeekKey() {
        const today = new Date();
        today.setHours(0,0,0,0);
        if (today < ACTIVITY_START) return weeksData[0]?.key || '';
        if (today > ACTIVITY_END) return weeksData[weeksData.length-1]?.key || '';
        const day = today.getDay();
        if (day === 5 || day === 6 || day === 0) {
            for (let wk of weeksData) {
                if (today >= wk.friday && today <= wk.sunday) return wk.key;
            }
            return weeksData[weeksData.length-1]?.key || '';
        }
        const candidates = weeksData.filter(wk => wk.sunday < today);
        if (candidates.length > 0) return candidates[candidates.length-1].key;
        return weeksData[0]?.key || '';
    }

    /* ===== 過期判斷 ===== */
    function isExpired(voucher) {
        if (voucher.used) return false;
        const wk = weeksData.find(w => w.key === voucher.weekKey);
        if (!wk || !wk.redeemDeadline) return false;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        return today > wk.redeemDeadline;
    }
    function getDaysRemaining(voucher) {
        const wk = weeksData.find(w => w.key === voucher.weekKey);
        if (!wk || !wk.redeemDeadline) return null;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const deadline = new Date(wk.redeemDeadline);
        deadline.setHours(0, 0, 0, 0);
        const diff = Math.round((deadline - today) / (1000 * 60 * 60 * 24));
        return diff; // >0 剩 n 日, 0 今天, <0 已過期
    }

    /* ===== 資料 ===== */
    function reassignDisplayIds() {
        const sorted = [...vouchers].sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
        sorted.forEach((v,i) => { v.displayId = i + 1; });
        if (vouchers.length > 0) {
            nextDisplayId = Math.max(...vouchers.map(v => v.displayId)) + 1;
        } else {
            nextDisplayId = 1;
        }
    }
    function getNewDisplayId() { return nextDisplayId++; }

    function saveToLocalStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            vouchers: vouchers,
            nextDisplayId: nextDisplayId,
            version: '4.2',
            activity: '2026社區消費連環賞',
            lastUpdated: new Date().toISOString()
        }));
    }

    function loadFromLocalStorage() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            try {
                const data = JSON.parse(raw);
                if (data.vouchers && Array.isArray(data.vouchers)) {
                    vouchers = data.vouchers.filter(v => v && typeof v === 'object').map(v => ({
                        displayId: v.displayId !== undefined ? v.displayId : 0,
                        originalId: v.originalId || Date.now() + Math.random(),
                        weekKey: v.weekKey || (weeksData[0]?.key || ''),
                        couponType: v.couponType || 'gov',
                        amount: v.amount || 0,
                        wallet: v.wallet || 'MPay',
                        used: v.used === true,
                        usedTimestamp: v.usedTimestamp || null,
                        note: v.note || '',
                        createdAt: v.createdAt || new Date().toISOString()
                    }));
                    if (data.nextDisplayId) nextDisplayId = data.nextDisplayId;
                }
            } catch(e) { vouchers = []; }
        }
        reassignDisplayIds();
    }

    function loadLang() {
        const saved = localStorage.getItem(LANG_KEY);
        if (saved && I18N[saved]) currentLang = saved;
    }
    function saveLang() {
        localStorage.setItem(LANG_KEY, currentLang);
    }

    /* ===== i18n 套用 ===== */
    function applyI18n() {
        document.documentElement.lang = currentLang === 'en' ? 'en' : (currentLang === 'zh-CN' ? 'zh-CN' : 'zh-HK');
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.dataset.i18n;
            el.textContent = t(key);
        });
        document.querySelectorAll('[data-i18n-ph]').forEach(el => {
            el.placeholder = t(el.dataset.i18nPh);
        });
        // 更新語言按鈕狀態
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.lang === currentLang);
        });
    }

    /* ===== 渲染 ===== */
    function renderActivityStatus() {
        const today = new Date();
        today.setHours(0,0,0,0);
        const el = document.getElementById('activityStatus');
        if (today < ACTIVITY_START) {
            el.textContent = t('statusPending');
            el.className = 'activity-status pending';
        } else if (today > ACTIVITY_END) {
            el.textContent = t('statusEnded');
            el.className = 'activity-status ended';
        } else {
            el.textContent = t('statusActive');
            el.className = 'activity-status';
        }
    }

    function renderStats() {
        const weekKey = currentViewWeekKey || getDefaultWeekKey();
        let remaining = 0;
        let available = 0;
        if (weekKey) {
            vouchers.forEach(v => {
                if (v.weekKey === weekKey && (v.couponType || 'gov') === 'gov' && !v.used && !isExpired(v)) {
                    remaining += v.amount;
                    available += v.amount * 3;
                }
            });
        }
        document.getElementById('statRemaining').textContent = remaining.toFixed(0);
        document.getElementById('statAvailable').textContent = available.toFixed(0);
    }

    function renderVouchers() {
        const container = document.getElementById('voucherList');
        const targetWeek = currentViewWeekKey || getDefaultWeekKey();
        const weekVouchers = vouchers.filter(v => v.weekKey === targetWeek);

        if (weekVouchers.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <span class="emoji">🎫</span>
                    <p>${t('emptyTitle')}</p>
                    <p style="margin-top:6px;font-size:0.78rem;">${t('emptyHint')}</p>
                </div>`;
            document.getElementById('totalCount').textContent = `0 ${t('countUnit')}`.trim();
            return;
        }

        document.getElementById('totalCount').textContent = `${weekVouchers.length} ${t('countUnit')}`.trim();

        const walletNames = getWalletNames();
        const groups = {};
        walletNames.forEach(w => { groups[w] = []; });

        // 把券按當前語言的錢包名稱分組
        // 資料中的 wallet 儲存的是「原始」名稱（zh-HK），需要映射
        const originalToLocal = {};
        const originalNames = WALLET_NAMES['zh-HK'];
        walletNames.forEach((localName, idx) => {
            originalToLocal[originalNames[idx]] = localName;
        });

        weekVouchers.forEach(v => {
            const localName = originalToLocal[v.wallet] || v.wallet || walletNames[0];
            if (!groups[localName]) groups[localName] = [];
            groups[localName].push(v);
        });

        let html = '';
        walletNames.forEach(w => {
            const list = groups[w] || [];
            if (list.length === 0) return;

            const usedCount = list.filter(v => v.used).length;
            html += `
                <div class="wallet-group">
                    <div class="wallet-header">
                        <div class="wallet-avatar" data-wallet="${escapeAttr(w)}">${getWalletShort(w)}</div>
                        <div class="wallet-name">${escapeHtml(w)}</div>
                        <div class="wallet-meta">${usedCount}/${list.length}</div>
                    </div>
                    <div class="voucher-grid">`;

            const sorted = [...list].sort((a,b) => {
                if (a.used !== b.used) return a.used ? 1 : -1;
                return a.displayId - b.displayId;
            });

            sorted.forEach(v => {
                const expired = isExpired(v);
                const typeClass = v.couponType === 'merchant_discount' ? 'merchant'
                                : v.couponType === 'gift' ? 'gift' : '';
                const stateClass = v.used ? 'used' : (expired ? 'expired' : '');
                let amountHtml = '';
                if (v.couponType === 'gift') {
                    amountHtml = `<div class="v-amount">${escapeHtml(getShortTypeLabel('gift'))}</div>`;
                } else if (v.couponType === 'merchant_discount') {
                    amountHtml = `<div class="v-amount">${escapeHtml(getShortTypeLabel('merchant_discount'))}</div>`;
                } else {
                    amountHtml = `<div class="v-amount">$${v.amount}</div>`;
                }
                let statusText = t('statusUnused');
                if (v.used) statusText = t('statusUsed');
                else if (expired) statusText = t('statusExpired');

                html += `
                    <div class="voucher-card ${typeClass} ${stateClass}" data-id="${v.displayId}">
                        <div class="v-id">#${String(v.displayId).padStart(3,'0')}</div>
                        ${amountHtml}
                        <div class="v-status">${statusText}</div>
                    </div>`;
            });

            html += `</div></div>`;
        });

        // 剩餘天數提示（只顯示當前選中的週次，且該週有券）
        const wk = weeksData.find(w => w.key === targetWeek);
        if (wk && wk.redeemDeadline) {
            const today = new Date();
            today.setHours(0,0,0,0);
            const deadline = new Date(wk.redeemDeadline);
            deadline.setHours(0,0,0,0);
            const diff = Math.round((deadline - today) / (1000 * 60 * 60 * 24));
            let text = '';
            let urgent = false;
            if (diff < 0) {
                text = t('daysRemainingExpired');
                urgent = true;
            } else if (diff === 0) {
                text = t('daysRemainingToday');
                urgent = true;
            } else {
                text = t('daysRemaining', { n: diff });
                urgent = diff <= 2;
            }
            html += `<div class="days-remaining ${urgent ? 'urgent' : ''}">⏳ ${text}</div>`;
        }

        container.innerHTML = html;

        container.querySelectorAll('.voucher-card').forEach(card => {
            card.addEventListener('click', () => {
                const id = parseInt(card.dataset.id);
                openDetail(id);
            });
        });
    }

    function getShortTypeLabel(type) {
        const labels = COUPON_TYPE_LABELS[currentLang] || COUPON_TYPE_LABELS['zh-HK'];
        if (type === 'gift') {
            return currentLang === 'en' ? 'Gift' : (currentLang === 'zh-CN' ? '礼品' : '禮品');
        }
        if (type === 'merchant_discount') {
            return currentLang === 'en' ? '100-12' : '滿100減12';
        }
        return '';
    }

    function getWalletShort(w) {
        if (w.includes('MPay')) return 'MP';
        if (w.includes('支付寶') || w.includes('支付宝') || w.includes('Alipay')) return 'AP';
        if (w.includes('中銀') || w.includes('中银') || w.includes('BOC')) return 'BOC';
        if (w.includes('工銀') || w.includes('工银') || w.includes('ICBC')) return 'ICBC';
        if (w.includes('豐付') || w.includes('丰付') || w.includes('Fung')) return 'FBB';
        if (w.includes('廣發') || w.includes('广发') || w.includes('CGB')) return 'GF';
        if (w.includes('Luso')) return 'LP';
        if (w.includes('極易') || w.includes('极易') || w.includes('UePay')) return 'UE';
        return '💳';
    }

    function escapeHtml(s) {
        if (!s) return '';
        return String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    }
    function escapeAttr(s) {
        return escapeHtml(s).replace(/"/g, '&quot;');
    }

    /* ===== 週次下拉 ===== */
    function refreshWeekViewSelect() {
        const sel = document.getElementById('weekViewSelect');
        if (!sel) return;
        const prev = sel.value;
        sel.innerHTML = '';
        weeksData.forEach(wk => {
            const opt = document.createElement('option');
            opt.value = wk.key;
            opt.textContent = getWeekShortLabel(wk);
            sel.appendChild(opt);
        });
        if (prev && weeksData.some(w => w.key === prev)) {
            sel.value = prev;
            currentViewWeekKey = prev;
        } else {
            const def = getDefaultWeekKey() || weeksData[0]?.key || '';
            sel.value = def;
            currentViewWeekKey = def;
        }
    }

    function renderAll() {
        renderActivityStatus();
        refreshWeekViewSelect();
        renderStats();
        renderVouchers();
    }

    /* ===== 新增表單 ===== */
    function refreshWeekSelect() {
        const sel = document.getElementById('weekSelectAdd');
        const prev = sel.value;
        sel.innerHTML = '';
        weeksData.forEach(wk => {
            const opt = document.createElement('option');
            opt.value = wk.key;
            opt.textContent = getWeekFullLabel(wk);
            sel.appendChild(opt);
        });
        if (prev && weeksData.some(w => w.key === prev)) {
            sel.value = prev;
        } else {
            sel.value = getDefaultWeekKey() || weeksData[0]?.key || '';
        }
    }

    function updateAmountOptionsByType() {
        const typeSelect = document.getElementById('couponTypeSelect');
        const amountSelect = document.getElementById('voucherAmountSelect');
        const type = typeSelect.value;
        amountSelect.innerHTML = '';
        if (type === 'gov') {
            [10, 20, 50, 100, 200].forEach(a => {
                const o = document.createElement('option');
                o.value = a;
                o.textContent = a + ' MOP';
                if (a === 50) o.selected = true;
                amountSelect.appendChild(o);
            });
            amountSelect.disabled = false;
        } else if (type === 'merchant_discount') {
            const o = document.createElement('option');
            o.value = 12;
            o.textContent = currentLang === 'en' ? '100-12' : '滿100減12';
            o.selected = true;
            amountSelect.appendChild(o);
            amountSelect.disabled = true;
        } else {
            const o = document.createElement('option');
            o.value = 0;
            o.textContent = currentLang === 'en' ? 'Gift' : (currentLang === 'zh-CN' ? '礼品（非现金）' : '禮品（非現金）');
            o.selected = true;
            amountSelect.appendChild(o);
            amountSelect.disabled = true;
        }
    }

    function initWalletOptions() {
        const sel = document.getElementById('walletSelect');
        sel.innerHTML = `<option value="">${t('walletPlaceholder')}</option>`;
        const walletNames = getWalletNames();
        const originalNames = WALLET_NAMES['zh-HK'];
        walletNames.forEach((w, idx) => {
            const o = document.createElement('option');
            // value 永遠用原始（zh-HK）名稱，方便內部儲存統一
            o.value = originalNames[idx] || w;
            o.textContent = w;
            sel.appendChild(o);
        });
    }

    function addVoucher() {
        const weekKey = document.getElementById('weekSelectAdd').value;
        if (!weekKey) { alert(t('alertSelectWeek')); return; }

        const couponType = document.getElementById('couponTypeSelect').value;
        let amount = parseFloat(document.getElementById('voucherAmountSelect').value);
        if (couponType !== 'gift' && (isNaN(amount) || amount <= 0)) {
            alert(t('alertSelectAmount')); return;
        }
        if (couponType === 'gift') amount = 0;

        const wallet = document.getElementById('walletSelect').value;
        if (!wallet) { alert(t('alertSelectWallet')); return; }

        const newVoucher = {
            displayId: getNewDisplayId(),
            originalId: Date.now() + Math.floor(Math.random() * 10000),
            weekKey: weekKey,
            couponType: couponType,
            amount: amount,
            wallet: wallet,
            used: false,
            usedTimestamp: null,
            note: '',
            createdAt: new Date().toISOString()
        };
        vouchers.push(newVoucher);
        reassignDisplayIds();
        saveToLocalStorage();
        currentViewWeekKey = weekKey;
        renderAll();
        closeOverlay('addOverlay');
    }

    /* ===== 詳情彈窗 ===== */
    function openDetail(displayId) {
        const v = vouchers.find(x => x.displayId === displayId);
        if (!v) return;
        currentDetailId = displayId;

        const labels = COUPON_TYPE_LABELS[currentLang] || COUPON_TYPE_LABELS['zh-HK'];
        const amountEl = document.getElementById('detailAmount');
        if (v.couponType === 'gift') {
            amountEl.textContent = getShortTypeLabel('gift');
            amountEl.className = 'big gift';
        } else if (v.couponType === 'merchant_discount') {
            amountEl.textContent = getShortTypeLabel('merchant_discount');
            amountEl.className = 'big merchant';
        } else {
            amountEl.innerHTML = `$${v.amount}<small>MOP</small>`;
            amountEl.className = 'big';
        }

        document.getElementById('detailType').textContent = labels[v.couponType] || labels.gov;

        // 錢包：把原始名稱映射為當前語言
        const originalNames = WALLET_NAMES['zh-HK'];
        const walletNames = getWalletNames();
        const idx = originalNames.indexOf(v.wallet);
        const displayWallet = idx >= 0 ? walletNames[idx] : v.wallet;
        document.getElementById('detailWallet').textContent = displayWallet;

        document.getElementById('detailWeek').textContent = getWeekLabelByKey(v.weekKey);

        // 最低消費額
        let minSpendText = '';
        if (v.couponType === 'gift') minSpendText = '—';
        else if (v.couponType === 'merchant_discount') minSpendText = '100 MOP';
        else minSpendText = (v.amount * 3) + ' MOP';
        document.getElementById('detailMinSpend').textContent = minSpendText;

        // 核銷截止日
        const wk = weeksData.find(w => w.key === v.weekKey);
        if (wk && wk.redeemDeadline) {
            document.getElementById('detailDeadline').textContent = formatDate(wk.redeemDeadline);
        } else {
            document.getElementById('detailDeadline').textContent = '—';
        }

        // 狀態
        const expired = isExpired(v);
        let statusText = t('statusUnused');
        if (v.used) statusText = t('statusUsed');
        else if (expired) statusText = t('statusExpiredLong');
        document.getElementById('detailStatus').textContent = statusText;

        document.getElementById('detailNote').textContent = v.note || t('noteEmpty');

        const useBtn = document.getElementById('detailUseBtn');
        useBtn.style.display = (v.used || expired) ? 'none' : 'block';

        document.getElementById('detailOverlay').classList.add('open');
    }

    function markCurrentAsUsed() {
        const v = vouchers.find(x => x.displayId === currentDetailId);
        if (!v) return;
        if (v.used) { alert(t('alertAlreadyUsed')); return; }
        if (isExpired(v)) { alert(t('alertExpired')); return; }
        if (!confirm(t('confirmUse'))) return;
        v.used = true;
        v.usedTimestamp = new Date().toISOString();
        saveToLocalStorage();
        renderAll();
        openDetail(currentDetailId);
    }

    function deleteCurrent() {
        const v = vouchers.find(x => x.displayId === currentDetailId);
        if (!v) return;
        if (!confirm(t('confirmDelete'))) return;
        vouchers = vouchers.filter(x => x.displayId !== currentDetailId);
        reassignDisplayIds();
        saveToLocalStorage();
        renderAll();
        closeOverlay('detailOverlay');
    }

    /* ===== 備註編輯 ===== */
    function openNoteEditor() {
        const v = vouchers.find(x => x.displayId === currentDetailId);
        if (!v) return;
        document.getElementById('noteInput').value = v.note || '';
        closeOverlay('detailOverlay');
        document.getElementById('noteOverlay').classList.add('open');
    }

    function saveNote() {
        const v = vouchers.find(x => x.displayId === currentDetailId);
        if (!v) return;
        v.note = document.getElementById('noteInput').value;
        saveToLocalStorage();
        renderAll();
        closeOverlay('noteOverlay');
        openDetail(currentDetailId);
    }

    /* ===== 彈窗控制 ===== */
    function closeOverlay(id) {
        document.getElementById(id).classList.remove('open');
    }
    document.querySelectorAll('[data-close]').forEach(btn => {
        btn.addEventListener('click', () => closeOverlay(btn.dataset.close));
    });
    document.querySelectorAll('.overlay').forEach(ov => {
        ov.addEventListener('click', e => {
            if (e.target === ov) ov.classList.remove('open');
        });
    });

    /* ===== 資料匯出/匯入 ===== */
    function exportData() {
        const data = {
            vouchers: vouchers,
            nextDisplayId: nextDisplayId,
            exportDate: new Date().toISOString(),
            description: '2026社區消費連環賞優惠券記錄'
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `macau_vouchers_${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function importData(file) {
        const reader = new FileReader();
        reader.onload = e => {
            try {
                const imported = JSON.parse(e.target.result);
                if (!imported.vouchers || !Array.isArray(imported.vouchers)) {
                    alert(t('alertImportFormat'));
                    return;
                }
                vouchers = imported.vouchers.map(v => ({
                    displayId: v.displayId !== undefined ? v.displayId : 0,
                    originalId: v.originalId || Date.now() + Math.random(),
                    weekKey: v.weekKey,
                    couponType: v.couponType || 'gov',
                    amount: v.amount || 0,
                    wallet: v.wallet,
                    used: v.used || false,
                    usedTimestamp: v.usedTimestamp || null,
                    note: v.note || '',
                    createdAt: v.createdAt || new Date().toISOString()
                }));
                if (imported.nextDisplayId) nextDisplayId = imported.nextDisplayId;
                reassignDisplayIds();
                saveToLocalStorage();
                renderAll();
                closeOverlay('settingsOverlay');
                alert(t('alertImportSuccess', { n: vouchers.length }));
            } catch(err) {
                alert(t('alertImportFail'));
            }
        };
        reader.readAsText(file);
    }

    function resetAll() {
        if (!confirm(t('confirmReset'))) return;
        vouchers = [];
        reassignDisplayIds();
        saveToLocalStorage();
        renderAll();
        closeOverlay('settingsOverlay');
    }

    /* ===== 語言切換 ===== */
    function switchLang(lang) {
        if (!I18N[lang]) return;
        currentLang = lang;
        saveLang();
        applyI18n();
        // 需要重建下拉（因為選項文字和錢包名稱都要換）
        initWalletOptions();
        updateAmountOptionsByType();
        refreshWeekViewSelect();
        refreshWeekSelect();
        renderAll();
    }

    /* ===== 綁定事件 ===== */
    function bindEvents() {
        document.getElementById('fabAddBtn').addEventListener('click', () => {
            refreshWeekSelect();
            document.getElementById('addOverlay').classList.add('open');
        });

        document.getElementById('settingsBtn').addEventListener('click', () => {
            document.getElementById('settingsOverlay').classList.add('open');
        });

        document.getElementById('couponTypeSelect').addEventListener('change', updateAmountOptionsByType);
        document.getElementById('addVoucherBtn').addEventListener('click', addVoucher);

        document.getElementById('weekViewSelect').addEventListener('change', (e) => {
            currentViewWeekKey = e.target.value;
            renderStats();
            renderVouchers();
        });

        document.getElementById('detailUseBtn').addEventListener('click', markCurrentAsUsed);
        document.getElementById('detailDeleteBtn').addEventListener('click', deleteCurrent);
        document.getElementById('detailNoteBtn').addEventListener('click', openNoteEditor);

        document.getElementById('saveNoteBtn').addEventListener('click', saveNote);

        document.getElementById('saveDataBtn').addEventListener('click', () => {
            saveToLocalStorage();
            alert(t('alertSaved'));
        });
        document.getElementById('exportDataBtn').addEventListener('click', exportData);
        document.getElementById('importDataBtn').addEventListener('click', () => {
            document.getElementById('importFileInput').click();
        });
        document.getElementById('importFileInput').addEventListener('change', e => {
            if (e.target.files.length) importData(e.target.files[0]);
            e.target.value = '';
        });
        document.getElementById('resetDataBtn').addEventListener('click', resetAll);

        // 語言按鈕
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => switchLang(btn.dataset.lang));
        });
    }

    /* ===== 初始化 ===== */
    function init() {
        weeksData = generateWeeksList();
        loadLang();
        applyI18n();
        initWalletOptions();
        updateAmountOptionsByType();
        bindEvents();
        loadFromLocalStorage();
        refreshWeekSelect();
        renderAll();
    }

    init();
</script>

<script defer src="https://events.vercount.one/js"></script>
</body>
