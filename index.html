<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>2026社區消費連環賞 - 優惠券管理器</title>
    <meta name="description" content="澳門2026社區消費連環賞，簡潔實用的電子優惠券記錄工具。">
    <meta name="keywords" content="2026社區消費連環賞,澳門社區消費,電子優惠券">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: system-ui, 'Segoe UI', 'Roboto', 'Noto Sans', 'PingFang TC', 'Microsoft YaHei', sans-serif;
        }
        body {
            background: #f5f7fb;
            margin: 0;
            padding: 0 0 100px 0;
            color: #1a2f4a;
            min-height: 100vh;
        }
        .app {
            max-width: 520px;
            margin: 0 auto;
            padding: 16px;
        }

        /* ===== 頂部標題 ===== */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 4px 16px;
        }
        .app-header h1 {
            margin: 0;
            font-size: 1.15rem;
            color: #1a2f4a;
            font-weight: 700;
        }
        .icon-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 50%;
            color: #1e5f9e;
            transition: 0.2s;
        }
        .icon-btn:active {
            background: #e8eef7;
        }

        /* ===== 活動日期卡 ===== */
        .activity-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 14px 16px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(30, 95, 158, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .activity-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .activity-icon {
            width: 38px;
            height: 38px;
            background: #e6f4ea;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }
        .activity-info .label {
            font-size: 0.72rem;
            color: #7b8a9e;
            margin-bottom: 2px;
        }
        .activity-info .value {
            font-size: 0.9rem;
            font-weight: 600;
            color: #1a2f4a;
        }
        .activity-status {
            background: #e6f4ea;
            color: #1e7a3f;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.72rem;
            font-weight: 700;
            white-space: nowrap;
        }
        .activity-status.ended {
            background: #f5e6e6;
            color: #a23b3b;
        }
        .activity-status.pending {
            background: #fdf3e3;
            color: #a16b1a;
        }

        /* ===== 統計卡片（兩張） ===== */
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 14px 16px;
            box-shadow: 0 2px 8px rgba(30, 95, 158, 0.06);
            position: relative;
        }
        .stat-card.blue {
            background: linear-gradient(135deg, #e8f1fb, #dbe9f9);
        }
        .stat-card.purple {
            background: linear-gradient(135deg, #eee8fb, #e4daf8);
        }
        .stat-card .stat-head {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            color: #5a7690;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .stat-card .stat-head .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .stat-card.blue .dot { background: #3b7cbf; }
        .stat-card.purple .dot { background: #8b5cf6; }
        .stat-card .stat-num {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1a2f4a;
            letter-spacing: -0.5px;
        }
        .stat-card .stat-num small {
            font-size: 0.7rem;
            font-weight: 600;
            color: #5a7690;
            margin-left: 3px;
        }

        /* ===== 區塊標題 ===== */
        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 0 4px;
        }
        .section-title h2 {
            margin: 0;
            font-size: 0.95rem;
            font-weight: 700;
            color: #1a2f4a;
        }
        .section-title .count {
            font-size: 0.8rem;
            color: #7b8a9e;
            font-weight: 500;
        }

        /* ===== 錢包分組卡片 ===== */
        .wallet-group {
            background: #ffffff;
            border-radius: 20px;
            padding: 14px 16px 16px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(30, 95, 158, 0.06);
        }
        .wallet-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0f4f9;
        }
        .wallet-avatar {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: white;
            font-size: 0.75rem;
            flex-shrink: 0;
        }
        .wallet-name {
            font-weight: 700;
            font-size: 0.9rem;
            color: #1a2f4a;
            flex: 1;
        }
        .wallet-meta {
            font-size: 0.72rem;
            color: #7b8a9e;
        }

        /* ===== 券小卡片 ===== */
        .voucher-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        @media (max-width: 380px) {
            .voucher-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .voucher-card {
            background: #f8fbff;
            border: 1.5px solid #d6e3f2;
            border-radius: 16px;
            padding: 12px 6px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
        }
        .voucher-card:active {
            transform: scale(0.96);
        }
        .voucher-card.used {
            background: #f3f5f8;
            border-color: #e2e6ec;
            opacity: 0.65;
        }
        .voucher-card.merchant {
            background: #fff8ee;
            border-color: #ffddb0;
        }
        .voucher-card.gift {
            background: #f1f8ec;
            border-color: #cbe5b8;
        }
        .voucher-card .v-amount {
            font-size: 1.35rem;
            font-weight: 800;
            color: #1e5f9e;
            line-height: 1.1;
            letter-spacing: -0.5px;
        }
        .voucher-card.used .v-amount {
            color: #98a4b3;
        }
        .voucher-card.merchant .v-amount {
            color: #b35c00;
            font-size: 1.05rem;
        }
        .voucher-card.gift .v-amount {
            color: #2d5a1b;
            font-size: 1.05rem;
        }
        .voucher-card .v-amount small {
            font-size: 0.65rem;
            font-weight: 600;
            margin-left: 2px;
        }
        .voucher-card .v-status {
            font-size: 0.7rem;
            font-weight: 700;
            margin-top: 6px;
            color: #3b7cbf;
        }
        .voucher-card.used .v-status {
            color: #98a4b3;
        }
        .voucher-card .v-id {
            position: absolute;
            top: 4px;
            right: 6px;
            font-size: 0.6rem;
            color: #b0bcc9;
            font-weight: 600;
        }

        /* ===== 空狀態 ===== */
        .empty-state {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            color: #7b8a9e;
            box-shadow: 0 2px 8px rgba(30, 95, 158, 0.06);
        }
        .empty-state .emoji {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 10px;
            opacity: 0.6;
        }
        .empty-state p {
            margin: 0;
            font-size: 0.85rem;
        }

        /* ===== 懸浮按鈕 ===== */
        .fab {
            position: fixed;
            right: 20px;
            bottom: 24px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffb347, #ff8c42);
            color: white;
            border: none;
            font-size: 1.7rem;
            font-weight: 300;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(255, 140, 66, 0.45);
            transition: all 0.2s;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .fab:active {
            transform: scale(0.94);
        }

        /* ===== 彈窗 (通用) ===== */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(20, 40, 70, 0.45);
            z-index: 100;
            align-items: flex-end;
            justify-content: center;
            backdrop-filter: blur(2px);
        }
        .overlay.open {
            display: flex;
        }
        .sheet {
            background: #ffffff;
            width: 100%;
            max-width: 520px;
            border-radius: 24px 24px 0 0;
            padding: 20px 20px 28px;
            max-height: 88vh;
            overflow-y: auto;
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .sheet-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            position: sticky;
            top: -20px;
            background: #ffffff;
            padding: 6px 0 10px;
            z-index: 2;
        }
        .sheet-header h3 {
            margin: 0;
            font-size: 1.05rem;
            color: #1a2f4a;
        }
        .close-btn {
            background: #f0f4f9;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            color: #5a7690;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== 表單欄位 ===== */
        .field {
            margin-bottom: 14px;
        }
        .field label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: #5a7690;
            margin-bottom: 6px;
            padding-left: 4px;
        }
        .field select,
        .field input,
        .field textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #d6e3f2;
            border-radius: 14px;
            font-size: 0.92rem;
            background: #ffffff;
            outline: none;
            transition: 0.15s;
            font-family: inherit;
            color: #1a2f4a;
        }
        .field select:focus,
        .field input:focus,
        .field textarea:focus {
            border-color: #1e5f9e;
            box-shadow: 0 0 0 3px rgba(30, 95, 158, 0.1);
        }
        .field textarea {
            resize: vertical;
            min-height: 80px;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #ffb347, #ff8c42);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 140, 66, 0.35);
            margin-top: 6px;
            transition: 0.2s;
        }
        .submit-btn:active {
            transform: scale(0.98);
        }
        .submit-btn.secondary {
            background: #f0f4f9;
            color: #1e5f9e;
            box-shadow: none;
        }
        .submit-btn.danger {
            background: #e76f51;
            box-shadow: 0 4px 12px rgba(231, 111, 81, 0.35);
        }

        /* ===== 詳情彈窗內容 ===== */
        .detail-amount {
            text-align: center;
            padding: 16px 0 8px;
        }
        .detail-amount .big {
            font-size: 2.4rem;
            font-weight: 800;
            color: #1e5f9e;
            letter-spacing: -1px;
        }
        .detail-amount .big.merchant { color: #b35c00; font-size: 1.6rem; }
        .detail-amount .big.gift { color: #2d5a1b; font-size: 1.6rem; }
        .detail-amount .big small {
            font-size: 0.9rem;
            color: #5a7690;
            font-weight: 600;
            margin-left: 4px;
        }
        .detail-type {
            text-align: center;
            font-size: 0.8rem;
            color: #7b8a9e;
            margin-bottom: 16px;
        }
        .detail-rows {
            background: #f8fbff;
            border-radius: 16px;
            padding: 4px 14px;
            margin-bottom: 16px;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 0;
            border-bottom: 1px solid #e8eef7;
            font-size: 0.88rem;
        }
        .detail-row:last-child {
            border-bottom: none;
        }
        .detail-row .k {
            color: #5a7690;
            font-weight: 500;
        }
        .detail-row .v {
            color: #1a2f4a;
            font-weight: 600;
            text-align: right;
            max-width: 60%;
            word-break: break-word;
        }
        .detail-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }
        .detail-actions .submit-btn {
            margin-top: 0;
        }
        .detail-note-btn {
            grid-column: 1 / -1;
        }

        /* ===== 設定清單 ===== */
        .settings-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .settings-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: #f8fbff;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            color: #1a2f4a;
            text-align: left;
            width: 100%;
            font-weight: 500;
            transition: 0.15s;
        }
        .settings-item:active {
            background: #eef4fb;
        }
        .settings-item .icon {
            font-size: 1.15rem;
        }
        .settings-item.danger {
            color: #c94a2c;
            background: #fdf0ed;
        }
        .settings-note {
            margin-top: 16px;
            padding: 12px 14px;
            background: #f0f6fc;
            border-radius: 14px;
            font-size: 0.75rem;
            color: #5a7690;
            line-height: 1.5;
            display: flex;
            gap: 8px;
        }
        .settings-note .icon { font-size: 0.95rem; }

        /* ===== 隱藏 input ===== */
        #importFileInput { display: none; }

        /* ===== 桌面優化 ===== */
        @media (min-width: 900px) {
            .app {
                max-width: 900px;
            }
            .voucher-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            .fab {
                right: calc(50% - 450px + 20px);
            }
        }
        @media (min-width: 1200px) {
            .app {
                max-width: 1100px;
            }
            .voucher-grid {
                grid-template-columns: repeat(5, 1fr);
            }
            .fab {
                right: calc(50% - 550px + 24px);
            }
        }

        /* ===== 為不同錢包指定顏色 ===== */
        .wallet-avatar[data-wallet="MPay"] { background: #e83f3f; }
        .wallet-avatar[data-wallet="支付寶（澳門）"] { background: #1677ff; }
        .wallet-avatar[data-wallet="澳門中銀手機銀行"] { background: #c8102e; }
        .wallet-avatar[data-wallet="工銀e支付"] { background: #b41f24; }
        .wallet-avatar[data-wallet="豐付寶"] { background: #00693e; }
        .wallet-avatar[data-wallet="廣發移動支付錢包"] { background: #c8102e; }
        .wallet-avatar[data-wallet="LusoPay"] { background: #e30613; }
        .wallet-avatar[data-wallet="極易付（UePay）"] { background: #1e5f9e; }
    </style>
</head>
<body>
<div class="app">

    <!-- 頂部標題 -->
    <div class="app-header">
        <h1>優惠券管理器</h1>
        <button class="icon-btn" id="settingsBtn" title="設定">⚙️</button>
    </div>

    <!-- 活動日期卡 -->
    <div class="activity-card">
        <div class="activity-left">
            <div class="activity-icon">📅</div>
            <div class="activity-info">
                <div class="label">活動日期</div>
                <div class="value" id="activityDateText">2026/10/09 - 2026/12/17</div>
            </div>
        </div>
        <div class="activity-status" id="activityStatus">載入中</div>
    </div>

    <!-- 統計兩張卡片 -->
    <div class="stats-row">
        <div class="stat-card blue">
            <div class="stat-head"><span class="dot"></span>未使用金額</div>
            <div class="stat-num"><span id="statRemaining">0</span><small>MOP</small></div>
        </div>
        <div class="stat-card purple">
            <div class="stat-head"><span class="dot"></span>可用優惠額度</div>
            <div class="stat-num"><span id="statAvailable">0</span><small>MOP</small></div>
        </div>
    </div>

    <!-- 記錄區域 -->
    <div class="section-title">
        <h2>我的優惠券</h2>
        <span class="count" id="totalCount">0 張</span>
    </div>
    <div id="voucherList"></div>

</div>

<!-- 懸浮新增按鈕 -->
<button class="fab" id="fabAddBtn" title="新增優惠券">+</button>

<!-- ===== 新增彈窗 ===== -->
<div class="overlay" id="addOverlay">
    <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-header">
            <h3>➕ 新增優惠券</h3>
            <button class="close-btn" data-close="addOverlay">✕</button>
        </div>

        <div class="field">
            <label>📆 領券週</label>
            <select id="weekSelectAdd"></select>
        </div>

        <div class="field">
            <label>🏷️ 券種</label>
            <select id="couponTypeSelect">
                <option value="gov" selected>政府電子優惠券</option>
                <option value="merchant_discount">商戶滿減券（滿100減12）</option>
                <option value="gift">消費禮遇券（禮品）</option>
            </select>
        </div>

        <div class="field">
            <label>💰 面額 / 內容</label>
            <select id="voucherAmountSelect">
                <option value="10">10 MOP</option>
                <option value="20">20 MOP</option>
                <option value="50" selected>50 MOP</option>
                <option value="100">100 MOP</option>
                <option value="200">200 MOP</option>
            </select>
        </div>

        <div class="field">
            <label>👛 電子錢包</label>
            <select id="walletSelect">
                <option value="">-- 請選擇錢包 --</option>
            </select>
        </div>

        <button class="submit-btn" id="addVoucherBtn">確認新增</button>
    </div>
</div>

<!-- ===== 詳情彈窗 ===== -->
<div class="overlay" id="detailOverlay">
    <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-header">
            <h3>優惠券詳情</h3>
            <button class="close-btn" data-close="detailOverlay">✕</button>
        </div>

        <div class="detail-amount">
            <div class="big" id="detailAmount">--</div>
        </div>
        <div class="detail-type" id="detailType">--</div>

        <div class="detail-rows">
            <div class="detail-row">
                <span class="k">📆 歸屬週次</span>
                <span class="v" id="detailWeek">--</span>
            </div>
            <div class="detail-row">
                <span class="k">👛 電子錢包</span>
                <span class="v" id="detailWallet">--</span>
            </div>
            <div class="detail-row">
                <span class="k">🎯 最低消費額</span>
                <span class="v" id="detailMinSpend">--</span>
            </div>
            <div class="detail-row">
                <span class="k">📌 使用狀態</span>
                <span class="v" id="detailStatus">--</span>
            </div>
            <div class="detail-row">
                <span class="k">📝 備註</span>
                <span class="v" id="detailNote">--</span>
            </div>
        </div>

        <div class="detail-actions">
            <button class="submit-btn" id="detailUseBtn">✅ 標記已用</button>
            <button class="submit-btn danger" id="detailDeleteBtn">🗑️ 刪除</button>
            <button class="submit-btn secondary detail-note-btn" id="detailNoteBtn">✏️ 編輯備註</button>
        </div>
    </div>
</div>

<!-- ===== 備註編輯彈窗 ===== -->
<div class="overlay" id="noteOverlay">
    <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-header">
            <h3>✏️ 編輯備註</h3>
            <button class="close-btn" data-close="noteOverlay">✕</button>
        </div>
        <div class="field">
            <textarea id="noteInput" placeholder="輸入備註資訊...&#10;例如：使用店家、消費明細、到期日等"></textarea>
        </div>
        <button class="submit-btn" id="saveNoteBtn">儲存備註</button>
    </div>
</div>

<!-- ===== 設定彈窗 ===== -->
<div class="overlay" id="settingsOverlay">
    <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-header">
            <h3>⚙️ 設定</h3>
            <button class="close-btn" data-close="settingsOverlay">✕</button>
        </div>

        <div class="settings-list">
            <button class="settings-item" id="saveDataBtn">
                <span class="icon">💾</span> 手動儲存至瀏覽器
            </button>
            <button class="settings-item" id="exportDataBtn">
                <span class="icon">📁</span> 匯出資料 (JSON)
            </button>
            <button class="settings-item" id="importDataBtn">
                <span class="icon">📂</span> 匯入資料 (JSON)
            </button>
            <input type="file" id="importFileInput" accept=".json">
            <button class="settings-item danger" id="resetDataBtn">
                <span class="icon">⚠️</span> 重置所有數據
            </button>
        </div>

        <div class="settings-note">
            <span class="icon">🔒</span>
            <span>隱私保障：所有資料僅儲存於您的瀏覽器本地，絕不上傳雲端。<br>
            <span style="display:inline-block;margin-top:6px;">總訪問次數：<strong id="vercount_value_page_pv">—</strong>　訪客人數：<strong id="vercount_value_page_uv">—</strong></span></span>
        </div>
    </div>
</div>

<script>
    /* ===== 活動設定 ===== */
    const ACTIVITY_START = new Date(2026, 9, 9);
    const ACTIVITY_END   = new Date(2026, 11, 17);
    const STORAGE_KEY = 'macau_voucher_2026_round2';

    const COUPON_TYPES = {
        gov: {
            label: '政府電子優惠券',
            amounts: [10, 20, 50, 100, 200],
            defaultAmount: 50,
            minSpendMultiplier: 3
        },
        merchant_discount: {
            label: '商戶滿減券',
            amounts: [12],
            defaultAmount: 12,
            minSpendMultiplier: 0,
            fixedMinSpend: 100,
            displayText: '滿100減12'
        },
        gift: {
            label: '消費禮遇券',
            amounts: [0],
            defaultAmount: 0,
            minSpendMultiplier: 0,
            displayText: '禮品'
        }
    };

    function getCouponTypeInfo(type) {
        return COUPON_TYPES[type] || COUPON_TYPES.gov;
    }
    function getMinSpend(voucher) {
        const ti = getCouponTypeInfo(voucher.couponType);
        if (ti.fixedMinSpend !== undefined) return ti.fixedMinSpend;
        return voucher.amount * ti.minSpendMultiplier;
    }
    function getAmountDisplay(voucher) {
        if (voucher.couponType === 'gift') return '禮品';
        if (voucher.couponType === 'merchant_discount') return '滿100減12';
        return voucher.amount + ' MOP';
    }
    function getMinSpendDisplay(voucher) {
        if (voucher.couponType === 'gift') return '—';
        return getMinSpend(voucher) + ' MOP';
    }

    const WALLETS = [
        "MPay",
        "支付寶（澳門）",
        "澳門中銀手機銀行",
        "工銀e支付",
        "豐付寶",
        "廣發移動支付錢包",
        "LusoPay",
        "極易付（UePay）"
    ];

    /* ===== 全域狀態 ===== */
    let vouchers = [];
    let weeksData = [];
    let nextDisplayId = 1;
    let currentDetailId = null;

    /* ===== 週次生成 ===== */
    function generateWeeksList() {
        let weeks = [];
        let startFriday = new Date(ACTIVITY_START);
        while (startFriday.getDay() !== 5) {
            startFriday.setDate(startFriday.getDate() + 1);
        }
        let weekIndex = 1;
        while (startFriday <= ACTIVITY_END) {
            let friday = new Date(startFriday);
            let sunday = new Date(friday);
            sunday.setDate(friday.getDate() + 2);
            if (sunday > ACTIVITY_END) break;
            let redeemDeadline = new Date(sunday);
            redeemDeadline.setDate(sunday.getDate() + 4);
            weeks.push({
                key: `${formatDateKey(friday)}_to_${formatDateKey(sunday)}`,
                label: `第${weekIndex}週 (${formatDate(friday)} ~ ${formatDate(sunday)})`,
                friday: new Date(friday),
                sunday: new Date(sunday),
                redeemDeadline: redeemDeadline
            });
            startFriday.setDate(startFriday.getDate() + 7);
            weekIndex++;
        }
        return weeks;
    }
    function formatDate(d) {
        return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
    }
    function formatDateKey(d) {
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function getWeekLabelByKey(key) {
        const wk = weeksData.find(w => w.key === key);
        return wk ? wk.label : key;
    }
    function getDefaultWeekKey() {
        const today = new Date();
        today.setHours(0,0,0,0);
        if (today < ACTIVITY_START) return weeksData[0]?.key || '';
        if (today > ACTIVITY_END) return weeksData[weeksData.length-1]?.key || '';
        const day = today.getDay();
        if (day === 5 || day === 6 || day === 0) {
            for (let wk of weeksData) {
                if (today >= wk.friday && today <= wk.sunday) return wk.key;
            }
            return weeksData[weeksData.length-1]?.key || '';
        }
        const candidates = weeksData.filter(wk => wk.sunday < today);
        if (candidates.length > 0) return candidates[candidates.length-1].key;
        return weeksData[0]?.key || '';
    }

    /* ===== 資料 ===== */
    function reassignDisplayIds() {
        const sorted = [...vouchers].sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
        sorted.forEach((v,i) => { v.displayId = i + 1; });
        if (vouchers.length > 0) {
            nextDisplayId = Math.max(...vouchers.map(v => v.displayId)) + 1;
        } else {
            nextDisplayId = 1;
        }
    }
    function getNewDisplayId() { return nextDisplayId++; }

    function saveToLocalStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            vouchers: vouchers,
            nextDisplayId: nextDisplayId,
            version: '4.0',
            activity: '2026社區消費連環賞',
            lastUpdated: new Date().toISOString()
        }));
    }

    function loadFromLocalStorage() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            try {
                const data = JSON.parse(raw);
                if (data.vouchers && Array.isArray(data.vouchers)) {
                    vouchers = data.vouchers.filter(v => v && typeof v === 'object').map(v => ({
                        displayId: v.displayId !== undefined ? v.displayId : 0,
                        originalId: v.originalId || Date.now() + Math.random(),
                        weekKey: v.weekKey || (weeksData[0]?.key || ''),
                        couponType: v.couponType || 'gov',
                        amount: v.amount || 0,
                        wallet: v.wallet || WALLETS[0],
                        used: v.used === true,
                        usedTimestamp: v.usedTimestamp || null,
                        note: v.note || '',
                        createdAt: v.createdAt || new Date().toISOString()
                    }));
                    if (data.nextDisplayId) nextDisplayId = data.nextDisplayId;
                }
            } catch(e) { vouchers = []; }
        }
        reassignDisplayIds();
    }

    /* ===== 渲染 ===== */
    function renderActivityStatus() {
        const today = new Date();
        today.setHours(0,0,0,0);
        const el = document.getElementById('activityStatus');
        if (today < ACTIVITY_START) {
            el.textContent = '即將開始';
            el.className = 'activity-status pending';
        } else if (today > ACTIVITY_END) {
            el.textContent = '已結束';
            el.className = 'activity-status ended';
        } else {
            el.textContent = '活動進行中';
            el.className = 'activity-status';
        }
        document.getElementById('activityDateText').textContent = '2026/10/09 - 2026/12/17';
    }

    function renderStats() {
        const now = new Date();
        now.setHours(0,0,0,0);
        let thisWeekKey = '';
        for (let wk of weeksData) {
            if (now >= wk.friday && now <= wk.sunday) {
                thisWeekKey = wk.key;
                break;
            }
        }
        if (!thisWeekKey) {
            // 週一~週四，找上一個過去的週
            const candidates = weeksData.filter(wk => wk.sunday < now);
            if (candidates.length > 0) thisWeekKey = candidates[candidates.length-1].key;
        }

        let remaining = 0;
        let available = 0;

        if (thisWeekKey) {
            vouchers.forEach(v => {
                if (v.weekKey === thisWeekKey && (v.couponType || 'gov') === 'gov' && !v.used) {
                    remaining += v.amount;
                    available += v.amount * 3;
                }
            });
        }

        document.getElementById('statRemaining').textContent = remaining.toFixed(0);
        document.getElementById('statAvailable').textContent = available.toFixed(0);
    }

    function renderVouchers() {
        const container = document.getElementById('voucherList');
        if (vouchers.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <span class="emoji">🎫</span>
                    <p>還沒有任何優惠券記錄</p>
                    <p style="margin-top:6px;font-size:0.78rem;">點擊右下角「+」按鈕新增</p>
                </div>`;
            document.getElementById('totalCount').textContent = '0 張';
            return;
        }

        document.getElementById('totalCount').textContent = vouchers.length + ' 張';

        // 按錢包分組
        const groups = {};
        WALLETS.forEach(w => { groups[w] = []; });
        vouchers.forEach(v => {
            const w = v.wallet || WALLETS[0];
            if (!groups[w]) groups[w] = [];
            groups[w].push(v);
        });

        let html = '';
        WALLETS.forEach(w => {
            const list = groups[w] || [];
            if (list.length === 0) return;

            const usedCount = list.filter(v => v.used).length;
            html += `
                <div class="wallet-group">
                    <div class="wallet-header">
                        <div class="wallet-avatar" data-wallet="${escapeAttr(w)}">${getWalletShort(w)}</div>
                        <div class="wallet-name">${escapeHtml(w)}</div>
                        <div class="wallet-meta">${usedCount}/${list.length}</div>
                    </div>
                    <div class="voucher-grid">`;

            // 未使用的排在前面
            const sorted = [...list].sort((a,b) => {
                if (a.used !== b.used) return a.used ? 1 : -1;
                return a.displayId - b.displayId;
            });

            sorted.forEach(v => {
                const typeInfo = getCouponTypeInfo(v.couponType);
                const typeClass = v.couponType === 'merchant_discount' ? 'merchant'
                                : v.couponType === 'gift' ? 'gift' : '';
                let amountHtml = '';
                if (v.couponType === 'gift') {
                    amountHtml = `<div class="v-amount">禮品</div>`;
                } else if (v.couponType === 'merchant_discount') {
                    amountHtml = `<div class="v-amount">滿100減12</div>`;
                } else {
                    amountHtml = `<div class="v-amount">$${v.amount}</div>`;
                }
                const statusText = v.used ? '已使用' : '未使用';
                html += `
                    <div class="voucher-card ${typeClass} ${v.used ? 'used' : ''}" data-id="${v.displayId}">
                        <div class="v-id">#${String(v.displayId).padStart(3,'0')}</div>
                        ${amountHtml}
                        <div class="v-status">${statusText}</div>
                    </div>`;
            });

            html += `</div></div>`;
        });

        container.innerHTML = html;

        // 綁定點擊
        container.querySelectorAll('.voucher-card').forEach(card => {
            card.addEventListener('click', () => {
                const id = parseInt(card.dataset.id);
                openDetail(id);
            });
        });
    }

    function getWalletShort(w) {
        if (w.includes('MPay')) return 'MP';
        if (w.includes('支付寶')) return 'AP';
        if (w.includes('中銀')) return 'BOC';
        if (w.includes('工銀')) return 'ICBC';
        if (w.includes('豐付寶')) return 'FBB';
        if (w.includes('廣發')) return 'GF';
        if (w.includes('Luso')) return 'LP';
        if (w.includes('極易付')) return 'UE';
        return '💳';
    }

    function escapeHtml(s) {
        if (!s) return '';
        return String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    }
    function escapeAttr(s) {
        return escapeHtml(s).replace(/"/g, '&quot;');
    }

    function renderAll() {
        renderActivityStatus();
        renderStats();
        renderVouchers();
        refreshWeekSelect();
    }

    /* ===== 新增表單 ===== */
    function refreshWeekSelect() {
        const sel = document.getElementById('weekSelectAdd');
        const prev = sel.value;
        sel.innerHTML = '';
        weeksData.forEach(wk => {
            const opt = document.createElement('option');
            opt.value = wk.key;
            opt.textContent = wk.label;
            sel.appendChild(opt);
        });
        if (prev && weeksData.some(w => w.key === prev)) {
            sel.value = prev;
        } else {
            sel.value = getDefaultWeekKey() || weeksData[0]?.key || '';
        }
    }

    function updateAmountOptionsByType() {
        const typeSelect = document.getElementById('couponTypeSelect');
        const amountSelect = document.getElementById('voucherAmountSelect');
        const type = typeSelect.value;
        const ti = getCouponTypeInfo(type);
        amountSelect.innerHTML = '';
        if (type === 'gov') {
            ti.amounts.forEach(a => {
                const o = document.createElement('option');
                o.value = a;
                o.textContent = a + ' MOP';
                if (a === ti.defaultAmount) o.selected = true;
                amountSelect.appendChild(o);
            });
            amountSelect.disabled = false;
        } else if (type === 'merchant_discount') {
            const o = document.createElement('option');
            o.value = 12;
            o.textContent = '滿100減12';
            o.selected = true;
            amountSelect.appendChild(o);
            amountSelect.disabled = true;
        } else {
            const o = document.createElement('option');
            o.value = 0;
            o.textContent = '禮品（非現金）';
            o.selected = true;
            amountSelect.appendChild(o);
            amountSelect.disabled = true;
        }
    }

    function initWalletOptions() {
        const sel = document.getElementById('walletSelect');
        sel.innerHTML = '<option value="">-- 請選擇錢包 --</option>';
        WALLETS.forEach(w => {
            const o = document.createElement('option');
            o.value = w;
            o.textContent = w;
            sel.appendChild(o);
        });
    }

    function addVoucher() {
        const weekKey = document.getElementById('weekSelectAdd').value;
        if (!weekKey) { alert('請選擇領券週次'); return; }

        const couponType = document.getElementById('couponTypeSelect').value;
        let amount = parseFloat(document.getElementById('voucherAmountSelect').value);
        if (couponType !== 'gift' && (isNaN(amount) || amount <= 0)) {
            alert('請選擇有效面額'); return;
        }
        if (couponType === 'gift') amount = 0;

        const wallet = document.getElementById('walletSelect').value;
        if (!wallet) { alert('請選擇電子錢包'); return; }

        const newVoucher = {
            displayId: getNewDisplayId(),
            originalId: Date.now() + Math.floor(Math.random() * 10000),
            weekKey: weekKey,
            couponType: couponType,
            amount: amount,
            wallet: wallet,
            used: false,
            usedTimestamp: null,
            note: '',
            createdAt: new Date().toISOString()
        };
        vouchers.push(newVoucher);
        reassignDisplayIds();
        saveToLocalStorage();
        renderAll();
        closeOverlay('addOverlay');
    }

    /* ===== 詳情彈窗 ===== */
    function openDetail(displayId) {
        const v = vouchers.find(x => x.displayId === displayId);
        if (!v) return;
        currentDetailId = displayId;

        const typeInfo = getCouponTypeInfo(v.couponType);
        const amountEl = document.getElementById('detailAmount');
        if (v.couponType === 'gift') {
            amountEl.textContent = '禮品';
            amountEl.className = 'big gift';
        } else if (v.couponType === 'merchant_discount') {
            amountEl.textContent = '滿100減12';
            amountEl.className = 'big merchant';
        } else {
            amountEl.innerHTML = `$${v.amount}<small>MOP</small>`;
            amountEl.className = 'big';
        }

        document.getElementById('detailType').textContent = typeInfo.label;
        document.getElementById('detailWeek').textContent = getWeekLabelByKey(v.weekKey);
        document.getElementById('detailWallet').textContent = v.wallet;
        document.getElementById('detailMinSpend').textContent = getMinSpendDisplay(v);
        document.getElementById('detailStatus').textContent = v.used ? '已使用' : '未使用';
        document.getElementById('detailNote').textContent = v.note || '（無）';

        const useBtn = document.getElementById('detailUseBtn');
        useBtn.style.display = v.used ? 'none' : 'block';

        document.getElementById('detailOverlay').classList.add('open');
    }

    function markCurrentAsUsed() {
        const v = vouchers.find(x => x.displayId === currentDetailId);
        if (!v) return;
        if (v.used) { alert('已經使用過'); return; }
        if (!confirm(`確定標記 ID ${String(v.displayId).padStart(4,'0')} 為已使用？`)) return;
        v.used = true;
        v.usedTimestamp = new Date().toISOString();
        saveToLocalStorage();
        renderAll();
        openDetail(currentDetailId);
    }

    function deleteCurrent() {
        const v = vouchers.find(x => x.displayId === currentDetailId);
        if (!v) return;
        if (!confirm(`確定刪除 ID ${String(v.displayId).padStart(4,'0')}？此操作無法復原。`)) return;
        vouchers = vouchers.filter(x => x.displayId !== currentDetailId);
        reassignDisplayIds();
        saveToLocalStorage();
        renderAll();
        closeOverlay('detailOverlay');
    }

    /* ===== 備註編輯 ===== */
    function openNoteEditor() {
        const v = vouchers.find(x => x.displayId === currentDetailId);
        if (!v) return;
        document.getElementById('noteInput').value = v.note || '';
        closeOverlay('detailOverlay');
        document.getElementById('noteOverlay').classList.add('open');
    }

    function saveNote() {
        const v = vouchers.find(x => x.displayId === currentDetailId);
        if (!v) return;
        v.note = document.getElementById('noteInput').value;
        saveToLocalStorage();
        renderAll();
        closeOverlay('noteOverlay');
        openDetail(currentDetailId);
    }

    /* ===== 彈窗控制 ===== */
    function closeOverlay(id) {
        document.getElementById(id).classList.remove('open');
    }
    function closeAllOverlays() {
        document.querySelectorAll('.overlay').forEach(el => el.classList.remove('open'));
    }
    document.querySelectorAll('[data-close]').forEach(btn => {
        btn.addEventListener('click', () => closeOverlay(btn.dataset.close));
    });
    document.querySelectorAll('.overlay').forEach(ov => {
        ov.addEventListener('click', e => {
            if (e.target === ov) ov.classList.remove('open');
        });
    });

    /* ===== 資料匯出/匯入 ===== */
    function exportData() {
        const data = {
            vouchers: vouchers,
            nextDisplayId: nextDisplayId,
            exportDate: new Date().toISOString(),
            description: '2026社區消費連環賞優惠券記錄'
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `macau_vouchers_${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function importData(file) {
        const reader = new FileReader();
        reader.onload = e => {
            try {
                const imported = JSON.parse(e.target.result);
                if (!imported.vouchers || !Array.isArray(imported.vouchers)) {
                    alert('檔案格式不正確');
                    return;
                }
                vouchers = imported.vouchers.map(v => ({
                    displayId: v.displayId !== undefined ? v.displayId : 0,
                    originalId: v.originalId || Date.now() + Math.random(),
                    weekKey: v.weekKey,
                    couponType: v.couponType || 'gov',
                    amount: v.amount || 0,
                    wallet: v.wallet,
                    used: v.used || false,
                    usedTimestamp: v.usedTimestamp || null,
                    note: v.note || '',
                    createdAt: v.createdAt || new Date().toISOString()
                }));
                if (imported.nextDisplayId) nextDisplayId = imported.nextDisplayId;
                reassignDisplayIds();
                saveToLocalStorage();
                renderAll();
                closeOverlay('settingsOverlay');
                alert(`匯入成功，共 ${vouchers.length} 筆記錄`);
            } catch(err) {
                alert('匯入失敗，JSON解析錯誤');
            }
        };
        reader.readAsText(file);
    }

    function resetAll() {
        if (!confirm('⚠️ 確定要重置所有資料嗎？此操作無法復原。')) return;
        vouchers = [];
        reassignDisplayIds();
        saveToLocalStorage();
        renderAll();
        closeOverlay('settingsOverlay');
    }

    /* ===== 綁定事件 ===== */
    function bindEvents() {
        document.getElementById('fabAddBtn').addEventListener('click', () => {
            document.getElementById('addOverlay').classList.add('open');
        });

        document.getElementById('settingsBtn').addEventListener('click', () => {
            document.getElementById('settingsOverlay').classList.add('open');
        });

        document.getElementById('couponTypeSelect').addEventListener('change', updateAmountOptionsByType);
        document.getElementById('addVoucherBtn').addEventListener('click', addVoucher);

        document.getElementById('detailUseBtn').addEventListener('click', markCurrentAsUsed);
        document.getElementById('detailDeleteBtn').addEventListener('click', deleteCurrent);
        document.getElementById('detailNoteBtn').addEventListener('click', openNoteEditor);

        document.getElementById('saveNoteBtn').addEventListener('click', saveNote);

        document.getElementById('saveDataBtn').addEventListener('click', () => {
            saveToLocalStorage();
            alert('已儲存');
        });
        document.getElementById('exportDataBtn').addEventListener('click', exportData);
        document.getElementById('importDataBtn').addEventListener('click', () => {
            document.getElementById('importFileInput').click();
        });
        document.getElementById('importFileInput').addEventListener('change', e => {
            if (e.target.files.length) importData(e.target.files[0]);
            e.target.value = '';
        });
        document.getElementById('resetDataBtn').addEventListener('click', resetAll);
    }

    /* ===== 初始化 ===== */
    function init() {
        weeksData = generateWeeksList();
        initWalletOptions();
        updateAmountOptionsByType();
        bindEvents();
        loadFromLocalStorage();
        renderAll();
    }

    init();
</script>

<script defer src="https://events.vercount.one/js"></script>
</body>
